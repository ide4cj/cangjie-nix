name: Update latest nightly

on:
  # Allow running from the Actions manually.
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manifest-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run manifest update
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO_NAME: nightly_build
          UPSTREAM_REPO_OWNER: cangjie-bot
        run: |
          python scripts/update-manifest-nightly.py

      - name: Create updater app installation
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MANIFEST_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANIFEST_UPDATER_APP_PRIVATE_KEY }}

      - name: Create PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/manifest-nightly-update
          base: master
          commit-message: "chore: update latest nightly manifest"
          title: "chore: update latest nightly manifest"
          body: |
            Update latest nightly cangjie versions in manifests.
            This PR is prepared automatically at  ${{ github.event.repository.updated_at}}.

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
